<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes de Campo - Privado</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; display: flex; flex-direction: column; }
    
    /* Pantalla de Login */
    #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f8fafc; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
    .auth-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
    .auth-box h2 { margin-top: 0; margin-bottom: 20px; color: #0f172a; }
    .auth-box input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
    .auth-box button { width: 100%; padding: 12px; margin-bottom: 10px; font-weight: bold; color: white; background: #0284c7; border: none; border-radius: 6px; cursor: pointer; }
    .auth-box button:hover { background: #0369a1; }
    .auth-box button.btn-secondary { background: #64748b; }
    .auth-box button.btn-google { background: #ffffff; color: #334155; border: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .auth-box button.btn-google:hover { background: #f1f5f9; }
    .divider { margin: 15px 0; color: #94a3b8; font-size: 14px; position: relative; }
    #auth-msg { color: #ef4444; font-size: 14px; margin-top: 10px; }

    #status-bar { padding: 8px; text-align: center; font-weight: bold; font-size: 14px; color: white; background: #10b981; }
    #status-bar.offline { background: #ef4444; }
    
    /* App Principal */
    #app-container { display: none; flex-direction: column; height: 100%; width: 100%; }
    #map { flex: 1; min-height: 40%; width: 100%; z-index: 1; transition: all 0.2s ease;}
    .map-fullscreen { position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; z-index: 9999 !important; }
    
    #form-container { height: 55%; padding: 15px; box-sizing: border-box; background: #f8fafc; overflow-y: auto; z-index: 2;}
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; }
    button.action-btn { background-color: #0284c7; color: white; font-weight: bold; border: none; cursor: pointer; padding: 12px; margin-top: 5px; width: 100%; border-radius: 6px;}
    button.action-btn:hover { background-color: #0369a1; }
    button.btn-danger { background-color: #ef4444; margin-top: 20px; }
    #btn-sync { background-color: #f59e0b; display: none; margin-bottom: 10px; }
    
    .coords-badge { font-size: 12px; color: #64748b; margin-bottom: 8px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .popup-img { width: 100%; max-height: 120px; object-fit: cover; border-radius: 4px; margin-top: 5px; }
    .leaflet-control-custom { background: white; width: 34px; height: 34px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; border-radius: 4px; box-shadow: 0 1px 5px rgba(0,0,0,0.65); }
  </style>
</head>
<body>

  <!-- PANTALLA DE AUTENTICACIÓN -->
  <div id="auth-screen">
    <div class="auth-box">
      <h2>Sistema de Reportes</h2>
      
      <button class="btn-google" onclick="iniciarSesionGoogle()">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continuar con Google
      </button>

      <div class="divider">O usa tu correo electrónico</div>

      <input type="email" id="email" placeholder="Correo electrónico">
      <input type="password" id="password" placeholder="Contraseña (Mín. 6 caracteres)">
      <button onclick="iniciarSesion()">Iniciar Sesión</button>
      <button class="btn-secondary" onclick="registrarse()">Crear Cuenta Nueva</button>
      <p id="auth-msg"></p>
      <small style="display:block; margin-top:15px; color:#94a3b8; font-size:11px;">v1.0.1 • Conectado vía GitHub</small>
    </div>
  </div>

  <!-- APLICACIÓN PRINCIPAL -->
  <div id="app-container">
    <div id="status-bar">Conectado a Internet</div>
    <div id="map"></div>

    <div id="form-container">
      <button type="button" id="btn-sync" class="action-btn" onclick="sincronizarPendientes()">Sincronizar Reportes Pendientes</button>
      
      <h3 style="margin-top: 0;">Nuevo Reporte</h3>
      <div class="coords-badge" id="coords-display">Coordenadas: Selecciona un punto</div>

      <form id="report-form">
        <input type="hidden" id="lat">
        <input type="hidden" id="lng">

        <div class="grid-2">
          <div class="form-group">
            <label>Fecha y Hora</label>
            <input type="datetime-local" id="fecha_evento" required>
          </div>
          <div class="form-group">
            <label>Reportado por</label>
            <input type="text" id="nombre_reportante" readonly style="background: #e2e8f0; color: #475569;">
          </div>
        </div>

        <div class="form-group">
          <label>Tipo de Evento</label>
          <select id="tipo" required>
            <option value="">Seleccione...</option>
            <option value="Bloqueo de vía">Bloqueo de vía</option>
            <option value="Punto de interés">Punto de interés / Logístico</option>
            <option value="Comunidad / Acceso">Acceso comunitario / Intervención</option>
            <option value="Incidente ambiental">Incidente ambiental / Clima</option>
            <option value="Otro">Otro</option>
          </select>
        </div>

        <div class="form-group">
          <label>Proyecto</label>
          <input type="text" id="proyecto" placeholder="Ej: Vía Uribia / Windpeshi" required>
        </div>

        <div class="form-group">
          <label>Descripción</label>
          <textarea id="descripcion" rows="2"></textarea>
        </div>

        <div class="form-group">
          <label>Evidencia Fotográfica</label>
          <input type="file" id="fotos-input" accept="image/*" multiple>
        </div>

        <button type="submit" id="btn-submit" class="action-btn">Guardar Reporte</button>
      </form>

      <button type="button" class="action-btn btn-danger" onclick="cerrarSesion()">Cerrar Sesión Segura</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW falló:', err));
    }

    const SUPABASE_URL = 'https://iubcpdpexiinxszzbwrw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_SFky7L_UPDvZhcfFh542og_jkUJSHXn';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;

    // --- LÓGICA DE AUTENTICACIÓN ---
    async function checkUserSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        currentUser = session.user;
        arrancarApp();
      }
    }
    checkUserSession();

    // Nueva función para Google Auth
    async function iniciarSesionGoogle() {
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin }
      });
      if (error) document.getElementById('auth-msg').innerText = error.message;
    }

    async function iniciarSesion() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) { document.getElementById('auth-msg').innerText = error.message; }
      else { currentUser = data.user; arrancarApp(); }
    }

    async function registrarse() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      if (error) { document.getElementById('auth-msg').innerText = error.message; }
      else {
        document.getElementById('auth-msg').innerText = "Cuenta creada correctamente.";
        setTimeout(iniciarSesion, 1000); 
      }
    }

    function arrancarApp() {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app-container').style.display = 'flex';
      document.getElementById('nombre_reportante').value = currentUser.email;
      cargarPuntosNube();
      setTimeout(() => map.invalidateSize(), 500);
    }

    async function cerrarSesion() {
      await supabaseClient.auth.signOut();
      window.location.reload();
    }

    // --- LÓGICA DE BASE DE DATOS LOCAL Y OFFLINE ---
    let localDB;
    const request = indexedDB.open('ReportesGuajira', 1);
    request.onupgradeneeded = (e) => {
      localDB = e.target.result;
      if (!localDB.objectStoreNames.contains('pendientes')) {
        localDB.createObjectStore('pendientes', { keyPath: 'id', autoIncrement: true });
      }
    };
    request.onsuccess = (e) => { localDB = e.target.result; verificarPendientes(); };

    const statusBar = document.getElementById('status-bar');
    function updateOnlineStatus() {
      if (navigator.onLine) {
        statusBar.textContent = 'Conectado a Internet';
        statusBar.className = '';
        if (localDB) verificarPendientes();
      } else {
        statusBar.textContent = 'Modo Offline: Sin conexión';
        statusBar.className = 'offline';
      }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    // --- INICIALIZAR MAPA ---
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    document.getElementById('fecha_evento').value = now.toISOString().slice(0,16);

    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
    const sateliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');

    const map = L.map('map', { center: [11.54, -72.90], zoom: 9, layers: [osmLayer] });
    L.control.layers({ "Mapa Calles": osmLayer, "Satélite": sateliteLayer }).addTo(map);

    const FullScreenControl = L.Control.extend({
      options: { position: 'topleft' },
      onAdd: function (map) {
        const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control leaflet-control-custom');
        container.title = 'Ampliar Mapa'; container.innerHTML = '⛶';
        container.onclick = function(e){
          e.preventDefault();
          const mapDiv = document.getElementById('map');
          mapDiv.classList.toggle('map-fullscreen');
          container.innerHTML = mapDiv.classList.contains('map-fullscreen') ? '✖' : '⛶';
          setTimeout(() => map.invalidateSize(), 200);
        }
        return container;
      }
    });
    map.addControl(new FullScreenControl());

    let currentMarker = null;
    function updateMarker(lat, lng) {
      if (currentMarker) currentMarker.setLatLng([lat, lng]);
      else {
        currentMarker = L.marker([lat, lng], { draggable: true }).addTo(map);
        currentMarker.on('dragend', (e) => setPoint(e.target.getLatLng().lat, e.target.getLatLng().lng));
      }
      setPoint(lat, lng);
    }
    function setPoint(lat, lng) {
      document.getElementById('lat').value = lat; document.getElementById('lng').value = lng;
      document.getElementById('coords-display').innerText = `Coordenadas: ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => { map.setView([pos.coords.latitude, pos.coords.longitude], 13); updateMarker(pos.coords.latitude, pos.coords.longitude); },
        () => updateMarker(11.54, -72.90), { enableHighAccuracy: true }
      );
    }
    map.on('click', (e) => updateMarker(e.latlng.lat, e.latlng.lng));

    function cargarPuntosNube() {
      if (!navigator.onLine || !currentUser) return;
      supabaseClient.from('reportes_campo').select('*').then(({data}) => {
        map.eachLayer((layer) => { if (layer instanceof L.CircleMarker) map.removeLayer(layer); });
        if(data) data.forEach(item => {
          L.circleMarker([item.latitud, item.longitud], { radius: 7 }).addTo(map).bindPopup(`<b>${item.tipo_evento}</b><br>${item.proyecto}`);
        });
      });
    }

    // --- ENVIAR REPORTE ---
    document.getElementById('report-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      btn.disabled = true;

      const lat = parseFloat(document.getElementById('lat').value);
      const lng = parseFloat(document.getElementById('lng').value);
      const archivosInput = document.getElementById('fotos-input').files;

      if (!lat || !lng) { alert('Selecciona ubicación'); btn.disabled = false; return; }

      const reporte = {
        tipo_evento: document.getElementById('tipo').value,
        proyecto: document.getElementById('proyecto').value,
        descripcion: document.getElementById('descripcion').value,
        latitud: lat,
        longitud: lng,
        fecha_evento: document.getElementById('fecha_evento').value,
        nombre_reportante: document.getElementById('nombre_reportante').value,
        fotosLocales: Array.from(archivosInput)
      };

      if (navigator.onLine) {
        btn.innerText = 'Subiendo a la nube...';
        try {
          await enviarASupabase(reporte);
          alert('Guardado exitosamente');
          document.getElementById('report-form').reset();
          document.getElementById('nombre_reportante').value = currentUser.email; 
          cargarPuntosNube();
        } catch(err) { alert('Error: ' + err.message); }
      } else {
        btn.innerText = 'Guardando en el celular...';
        guardarLocal(reporte);
        alert('Guardado local. Sincroniza al tener internet.');
        document.getElementById('report-form').reset();
        document.getElementById('nombre_reportante').value = currentUser.email;
      }
      
      btn.disabled = false;
      btn.innerText = 'Guardar Reporte';
    });

    function guardarLocal(reporte) {
      const tx = localDB.transaction('pendientes', 'readwrite');
      tx.objectStore('pendientes').add(reporte);
      tx.oncomplete = () => verificarPendientes();
    }

    async function enviarASupabase(reporte) {
      const fotosUrls = [];
      if (reporte.fotosLocales) {
        for (let file of reporte.fotosLocales) {
          const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 8)}.${file.name.split('.').pop()}`;
          const { error: uploadError } = await supabaseClient.storage.from('evidencias-campo').upload(fileName, file);
          if (!uploadError) {
            const { data } = supabaseClient.storage.from('evidencias-campo').getPublicUrl(fileName);
            fotosUrls.push(data.publicUrl);
          }
        }
      }
      delete reporte.fotosLocales;
      reporte.fotos = fotosUrls;

      const { error } = await supabaseClient.from('reportes_campo').insert([reporte]);
      if (error) throw error;
    }

    function verificarPendientes() {
      if (!localDB) return;
      const tx = localDB.transaction('pendientes', 'readonly');
      const req = tx.objectStore('pendientes').count();
      req.onsuccess = () => {
        const btnSync = document.getElementById('btn-sync');
        if (req.result > 0) {
          btnSync.style.display = 'block';
          btnSync.innerText = `Sincronizar ${req.result} Reporte(s) Pendiente(s)`;
        } else {
          btnSync.style.display = 'none';
        }
      };
    }

    async function sincronizarPendientes() {
      if (!navigator.onLine) return alert('Necesitas internet.');
      const btnSync = document.getElementById('btn-sync');
      btnSync.disabled = true;
      btnSync.innerText = 'Sincronizando...';

      const tx = localDB.transaction('pendientes', 'readonly');
      const req = tx.objectStore('pendientes').getAll();
      
      req.onsuccess = async () => {
        const reportes = req.result;
        for (let rep of reportes) {
          try {
            const idLocal = rep.id;
            delete rep.id;
            await enviarASupabase(rep);
            
            const txBorrar = localDB.transaction('pendientes', 'readwrite');
            txBorrar.objectStore('pendientes').delete(idLocal);
          } catch (e) { console.error(e); }
        }
        alert('Sincronización completada');
        verificarPendientes();
        cargarPuntosNube();
      };
    }
  </script>
</body>
</html>
